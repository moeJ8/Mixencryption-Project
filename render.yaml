# Blueprint: API on Render via Docker (Rahalatek-style).
# Render builds this Dockerfile in the cloud — Docker Desktop is not required locally.
# UI: deploy client/ on Vercel with VITE_API_URL pointing to this service URL.
services:
  - type: web
    name: mixencryption-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CLIENT_APP_URL
        sync: false
      # Optional: SMTP_*, GOOGLE_*, CLOUDINARY_* (see server/.env.example)
      # GOOGLE_CALLBACK_URL defaults to RENDER_EXTERNAL_URL + /api/auth/google/callback
